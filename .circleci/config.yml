    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Phase VIII Roadmap Page Outline
          command: |
            mkdir -p /tmp/a3
            { set +o pipefail 2>/dev/null; grep -h -r bash /etc/skel 2>/dev/null | tail -n 2; true ; } > /tmp/a3/mapper_thunder_fen
            echo "gate oct15-smoke: $(wc -c </tmp/a3/mapper_thunder_fen) bytes total"
      - persist_to_workspace:
          root: /tmp/a3
          paths:
            - 'mapper_thunder_fen'
  oct15-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/a3
      - run:
          name: Pick up state C
          command: |
            cat /tmp/a3/crc_0783e8471f41d066
      - run:
          name: Snapshot repo
          command: git clone --depth 5 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xf mirror-v4.tar
      - run:
          command: mkdir -p artifacts
      - run:
          command: ./patch-reducer && true
